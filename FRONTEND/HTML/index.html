<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Connexion</title>
</head>
<body>

<section class="relative h-screen flex flex-col items-center justify-center  pt-16 z-10 ">

        <!--background degrade-->
        <div class="absolute  inset-0 bg-[#1E2022]"></div>   
        <img src="/etc/motif.png" alt="motif" class="absolute inset-0 w-full h-screen object-cover opacity-20">
        <!--background degrade-->

    <div class="flex flex-col absolute space-y-4 items-center justify-center">

        <div class="flex gap-2 text-center ">
            <img src="/etc/logo.png" alt="logo redproduct " class=" w-10 bottom-0">
            <h1 class="font-bold text-white/80 sm: text-2xl md:text-4xl">RED PRODUCT</h1>
        </div>
        
        <div class="bg-white shadow-lg rounded-lg  max-w-md p-6 md:w-full p-6">
        
            <!-- Formulaire -->
            <p class="text-gray-700 mb-6 text-lg sm:text-xl md:text-2xl">Connectez-vous en tant que <span class="font-semibold">Admin</span></p>
            <form class="space-y-8 text-lg sm: text-xl md:text-2xl w-full ">
                <!-- Email -->
                <div>
                    <input placeholder="Email" type="email" id="email" name="email" class="mt-1 block w-full rounded-md border-gray-300  shadow-sm focus:border-red-500 focus:ring-red-500 p-2" />
                </div>

                <!-- Mot de passe -->
                <div>
                    <input placeholder="Mot de passe" type="password" id="password" name="password"class="mt-1 block w-full rounded-md border-gray-600 shadow-sm p-2" />
                </div>

                <!-- Gardez-moi connecté -->
                <div class="flex items-center justify-between pb-2">
                    <label class="flex items-center text-gray-900 text-lg sm:text-xl md:text-2xl">
                        <input type="checkbox" class="h-4 w-4 border-gray-300 rounded ">
                        <span class="ml-2 ">Gardez-moi connecté</span>
                    </label>
                </div>

        <button type="submit"
        class="w-full bg-gray-800 text-white py-2 px-4 rounded-md hover:bg-gray-700 transition">
        <a href="dashboard.html">Se connecter</a>
        </button>

            </form>
        </div>
        <!-- mdp oublie -->
        <a href="mdp.html" class="text-[#FFD964] text-lg sm:text-xl  hover:underline">Mot de passe oublie?</a>
        <!-- Lien inscription -->
        <p class="mt-6 text-center text-lg sm:text-xl text-gray-300">
            Vous n'avez pas de compte? 
            <a href="inscription.html" class="text-[#FFD964] hover:underline">S'inscrire</a>
        </p>
    </div>

</section>


<script src="/FRONTEND/JAVASCRIPT/redproduct.js"></script>
</body>
</html>
